[package]
name = "cli"
version = "0.7.0"
edition = "2024"
publish = false

[[bin]]
name = "ttcli"
path = "src/main.rs"

[features]
default = ["webapp", "tui"]
webapp = ["time-tracking-cli/webapp"]
tui = ["time-tracking-cli/tui"]

[dependencies]
time-tracking-cli = { path = "..", default-features = false }
anyhow = "1.0.100"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1.41"

[dev-dependencies]
tempfile = "3.8"

# Test-only. `cli_output_characterization` must launch `ttcli --tui` with no
# controlling terminal, which needs a raw `setsid(2)` in a `pre_exec` hook.
# Already in the lock transitively, so this adds no crate to the graph.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.177"
