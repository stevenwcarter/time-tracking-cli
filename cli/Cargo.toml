[package]
name = "cli"
version = "0.7.0"
edition = "2024"
publish = false

[[bin]]
name = "ttcli"
path = "src/main.rs"

[features]
default = ["webapp", "tui"]
webapp = ["time-tracking-cli/webapp"]
tui = ["time-tracking-cli/tui"]

[dependencies]
time-tracking-cli = { path = "..", default-features = false }
anyhow = "1.0.100"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1.41"

[dev-dependencies]
tempfile = "3.8"
