[package]
name = "time-tracking-cli"
version = "0.7.0"
edition = "2024"
publish = false

[features]
default = ["webapp", "tui"]
webapp = [
    "axum",
    "tower",
    "tower-http",
    "serde_json",
    "juniper",
    "juniper_axum",
    "juniper_graphql_ws",
    "rust-embed",
    "axum-embed",
]
tui = ["crossterm", "ratatui", "copypasta", "derive_setters"]

[[bin]]
name = "ttcli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
dirs = "5.0"
time-tracking-parser = { git = "https://github.com/stevenwcarter/time-tracking-parser" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
futures = "0.3"
anyhow = "1.0.100"
tokio = { version = "1.0", features = ["full"] }
time = { version = "0.3.44", features = [
    "formatting",
    "local-offset",
    "macros",
] }

# Web server dependencies (optional, behind webapp feature)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = [
    "fs",
    "cors",
    "compression-gzip",
    "compression-zstd",
    "compression-deflate",
    "full",
], optional = true }
serde_json = { version = "1.0", optional = true }
juniper_graphql_ws = { git = "https://github.com/graphql-rust/juniper", features = [
    "graphql-transport-ws",
], optional = true }
juniper = { git = "https://github.com/graphql-rust/juniper", features = [
    "chrono",
    "bson",
], default-features = false, optional = true }
juniper_axum = { git = "https://github.com/graphql-rust/juniper", features = [
    "subscriptions",
], optional = true }
rust-embed = { version = "8.7.2", features = [
    "axum",
    "axum-ex",
    "compression",
    "debug-embed",
    "tokio",
], optional = true }
axum-embed = { version = "0.1.0", optional = true }

# TUI dependencies
crossterm = { version = "0.28.1", features = ["event-stream"], optional = true }
ratatui = { version = "0.29.0", features = [
    "widget-calendar",
], optional = true }
copypasta = { version = "0.10.2", optional = true }
derive_setters = { version = "0.1.8", optional = true }
tracing-appender = "0.2.3"

[dev-dependencies]
tempfile = "3.8"
