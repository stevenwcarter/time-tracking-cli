[package]
name = "time-tracking-cli"
version = "0.5.1"
edition = "2024"
publish = false

[features]
default = ["webapp"]
webapp = [
  "axum",
  "tokio",
  "tower",
  "tower-http",
  "serde_json",
  "juniper",
  "juniper_axum",
  "juniper_graphql_ws",
  "rust-embed",
  "axum-embed",
]

[[bin]]
name = "ttcli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
dirs = "5.0"
time-tracking-parser = { git = "https://github.com/stevenwcarter/time-tracking-parser" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
futures = "0.3"
anyhow = "1.0.100"

# Web server dependencies (optional, behind webapp feature)
axum = { version = "0.8", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = [
  "fs",
  "cors",
  "compression-gzip",
  "compression-zstd",
  "compression-deflate",
  "full",
], optional = true }
serde_json = { version = "1.0", optional = true }
juniper_graphql_ws = { git = "https://github.com/graphql-rust/juniper", features = [
  "graphql-transport-ws",
], optional = true }
juniper = { git = "https://github.com/graphql-rust/juniper", features = [
  "chrono",
  "bson",
], default-features = false, optional = true }
juniper_axum = { git = "https://github.com/graphql-rust/juniper", features = [
  "subscriptions",
], optional = true }
rust-embed = { version = "8.7.2", features = [
  "axum",
  "axum-ex",
  "compression",
  "debug-embed",
  "tokio",
], optional = true }
axum-embed = { version = "0.1.0", optional = true }
