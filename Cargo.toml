[workspace]
members = [".", "cli"]
resolver = "2"

[package]
name = "time-tracking-cli"
version = "0.8.0"
edition = "2024"
publish = false

[lib]
name = "time_tracking_cli"
path = "src/lib.rs"

[features]
default = ["webapp", "tui", "cli"]
webapp = [
    "axum",
    "tower",
    "tower-http",
    "serde_json",
    "juniper",
    "juniper_axum",
    "juniper_graphql_ws",
    "rust-embed",
    "axum-embed",
    "cli",
]
tui = [
    "crossterm",
    "ratatui",
    "copypasta",
    "derive_setters",
    "unicode-width",
    "cli",
]
cli = ["clap"]

[dependencies]
dirs = "5.0"
time-tracking-parser = { git = "https://github.com/stevenwcarter/time-tracking-parser" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
futures = "0.3"
anyhow = "1.0.100"
tokio = { version = "1.0", features = ["full"] }
time = { version = "0.3.44", features = [
    "formatting",
    "local-offset",
    "macros",
    # `data_svc` parses day-file names back into dates, and it is compiled
    # under every feature set. Enabled transitively today by `tracing-appender`;
    # declared here so it does not turn into a build break if that changes.
    "parsing",
] }

# Web server dependencies (optional, behind webapp feature)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = [
    "fs",
    "cors",
    "compression-gzip",
    "compression-zstd",
    "compression-deflate",
    "full",
], optional = true }
serde_json = { version = "1.0", optional = true }
juniper_graphql_ws = { git = "https://github.com/graphql-rust/juniper", rev = "0e14736ad1acbb8a25f142ec426203c8797c4755", features = [
    "graphql-transport-ws",
], optional = true }
juniper = { git = "https://github.com/graphql-rust/juniper", rev = "0e14736ad1acbb8a25f142ec426203c8797c4755", features = [
    "chrono",
    "bson",
], default-features = false, optional = true }
juniper_axum = { git = "https://github.com/graphql-rust/juniper", rev = "0e14736ad1acbb8a25f142ec426203c8797c4755", features = [
    "subscriptions",
], optional = true }
rust-embed = { version = "8.7.2", features = [
    "axum",
    "axum-ex",
    "compression",
    "debug-embed",
    "tokio",
], optional = true }
axum-embed = { version = "0.1.0", optional = true }

# CLI dependencies
clap = { version = "4.4", features = ["derive"], optional = true }

# TUI dependencies
crossterm = { version = "0.28.1", features = ["event-stream"], optional = true }
ratatui = { version = "0.29.0", features = [
    "widget-calendar",
], optional = true }
copypasta = { version = "0.10.2", optional = true }
derive_setters = { version = "0.1.8", optional = true }
unicode-width = { version = "0.2", optional = true }
tracing-appender = "0.2.3"
interim = { version = "0.2.1", features = ["time_0_3"] }

[dev-dependencies]
tempfile = "3.8"

# A hard dependency rather than an optional one behind `tui`: a `dep:libc`
# reference inside the `tui` feature would name a dependency that does not
# exist on Windows, and Cargo rejects that. Unix-only and tiny.
[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

# Test-only. `a_fifo_named_like_a_day_file_is_not_a_candidate` needs `mkfifo`,
# which std does not expose. Already in the lock transitively.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.177"
