[package]
name = "time-tracking-cli"
version = "0.1.0"
edition = "2024"

[features]
default = ["webapp"]
webapp = ["axum", "tokio", "tower", "tower-http", "serde_json"]

[[bin]]
name = "ttcli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
dirs = "5.0"
time-tracking-parser = { git = "https://github.com/stevenwcarter/time-tracking-parser" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

# Web server dependencies (optional, behind webapp feature)
axum = { version = "0.7", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["fs", "cors"], optional = true }
serde_json = { version = "1.0", optional = true }
futures = "0.3"
