[package]
name = "time-tracking-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "time-tracking-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
dirs = "5.0"
time-tracking-parser = { git = "https://github.com/stevenwcarter/time-tracking-parser" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
