name: Release Build

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        working-directory: ./site
        run: yarn install

      - name: Build frontend
        working-directory: ./site
        run: yarn build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: site/build/
          retention-days: 1

  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: build-frontend
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: intel-mac
            archive_format: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: silicon-mac
            archive_format: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x64
            archive_format: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x64
            archive_format: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: site/build/

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build Rust binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Get tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create archive
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            # Windows: Create zip file with .exe extension
            7z a ../../../time-tracking-cli-${{ steps.tag.outputs.TAG_NAME }}-${{ matrix.name }}.zip ttcli.exe
          else
            # Unix: Create tar.gz file
            tar -czf ../../../time-tracking-cli-${{ steps.tag.outputs.TAG_NAME }}-${{ matrix.name }}.tar.gz ttcli
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: time-tracking-cli-${{ steps.tag.outputs.TAG_NAME }}-${{ matrix.name }}
          path: time-tracking-cli-${{ steps.tag.outputs.TAG_NAME }}-${{ matrix.name }}.${{ matrix.archive_format }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Get tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Release ${{ steps.tag.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            time-tracking-cli-${{ steps.tag.outputs.TAG_NAME }}-intel-mac/time-tracking-cli-${{ steps.tag.outputs.TAG_NAME }}-intel-mac.tar.gz
            time-tracking-cli-${{ steps.tag.outputs.TAG_NAME }}-silicon-mac/time-tracking-cli-${{ steps.tag.outputs.TAG_NAME }}-silicon-mac.tar.gz
            time-tracking-cli-${{ steps.tag.outputs.TAG_NAME }}-linux-x64/time-tracking-cli-${{ steps.tag.outputs.TAG_NAME }}-linux-x64.tar.gz
            time-tracking-cli-${{ steps.tag.outputs.TAG_NAME }}-windows-x64/time-tracking-cli-${{ steps.tag.outputs.TAG_NAME }}-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
